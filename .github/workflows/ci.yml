name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m py_compile app.py desktop.py
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Required files
        run: |
          test -f static/index.html
          test -f static/styles.css
          test -f static/app.ico
          test -f LICENSE
